# ============================================================================
# 配置文件：config.ini
# ============================================================================
# 【包的作用】
# configparser 是 Python 标准库，用于读取 .ini 格式的配置文件。
# 它把配置按 [section] 分组，每个 section 下有 key = value 的键值对。
#
# 【为什么用 .ini 而不是 .py / .json / .yaml？】
# - .py：可以写逻辑但部署时容易误改代码
# - .json：不支持注释，维护困难
# - .yaml：需要额外安装 PyYAML，且缩进敏感容易出错
# - .ini：Python 标准库自带，支持注释，结构清晰，业界通用
#
# 【configparser 常用 API】
# - config.read(file)             → 读取配置文件
# - config.get(section, key)      → 获取字符串值（key 不存在会抛异常）
# - config.get(section, key, fallback='默认值') → 获取值，key 不存在时返回默认值
# - config.getint/getfloat/getboolean → 获取指定类型的值
# - config.sections()             → 返回所有 section 名称列表
# - config.items(section)         → 返回指定 section 的全部键值对
# ============================================================================


# ============================================================================
# 【MySQL 配置】
# 作用：存储问答记录、用户信息、知识库元数据等结构化数据
# 为什么需要：向量数据库负责"语义检索"，关系数据库负责"精确查询"，
#           两者互补，实际生产中通常同时使用
# ============================================================================
[mysql]
# 数据库主机地址，本机开发用 localhost/127.0.0.1，生产环境用实际 IP
host = localhost
# 数据库用户名
user = root
# 数据库密码（生产环境务必修改，不要用弱密码）
password = root
# 数据库名，bank_rag = 银行金融RAG知识库
database = bank_rag
# 端口，MySQL 默认 3306
port = 3306


# ============================================================================
# 【Redis 配置】
# 作用：缓存热点问答结果、会话管理、分布式锁、消息队列
# 为什么需要：RAG 系统查询 LLM 成本高，Redis 缓存可以避免重复调用，
#           同时支撑高并发场景下的会话状态管理
# ============================================================================
[redis]
# Redis 主机地址
host = localhost
# Redis 端口（Docker 映射到宿主机 16379，容器内部 6379）
port = 16379
# 密码（对应 Docker Compose 中 --requirepass "1234"）
password = 1234
# 数据库编号（Redis 有 0-15 共 16 个逻辑数据库，默认用 0）
db = 0


# ============================================================================
# 【Milvus 配置 — 向量数据库】
# 作用：存储金融文档的向量嵌入（Embedding），支持高效的语义相似度检索
# 为什么用 Milvus：
# - 专为向量检索设计，支持十亿级向量数据
# - 支持多种索引类型（IVF_FLAT、HNSW 等），检索速度极快
# - 支持标量过滤（按公司、年份、文档类型等元数据过滤）+ 向量检索的混合查询
# - 与 Faiss 相比：Milvus 是分布式服务，Faiss 是本地库，Milvus 更适合生产
# ============================================================================
[milvus]
# Milvus 服务地址
host = localhost
# Milvus gRPC 端口，默认 19530
port = 19530
# 数据库名（Milvus 2.x 支持多数据库，类似 MySQL 的 database 概念）
database_name = bank_rag
# 集合名（Collection，类似 MySQL 的 table，存储一组文档的向量）
collection_name = finance_knowledge


# ============================================================================
# 【LLM 配置 — 大语言模型】
# 作用：调用大模型做两件事 — 1) 生成文本嵌入向量 2) 根据检索结果生成回答
# 为什么用阿里云 DashScope：
# - 兼容 OpenAI 的 API 格式（/v1/chat/completions, /v1/embeddings）
# - 国内访问稳定，无需翻墙
# - 提供通义千问系列模型，中文能力强，适合金融领域的专业问答
# ============================================================================
[llm]
# 模型名称，例如：qwen-turbo, qwen-plus, qwen-max, qwen-long
# qwen-turbo：速度快成本低，适合简单任务
# qwen-plus：性价比高，推荐用于 RAG
# qwen-max：最强能力，成本最高
# qwen-long：支持超长上下文（千万 token），适合长文档分析（如年报全文）
model = qwen3.8-2.4t-a95b
# DashScope API Key（在阿里云灵积平台申请：https://dashscope.aliyun.com）
# 方式一：直接写在这里（仅本地开发，不要提交到 Git）
# dashscope_api_key = sk-xxxxxxxxxxxxxxxxxxxxxxxx
# 方式二：设为空，代码会自动从环境变量 DASHSCOPE_API_KEY 读取（推荐）
dashscope_api_key =
# DashScope 兼容 OpenAI 格式的 Base URL
# compatible-mode 表示以 OpenAI 兼容模式调用，这样可以用 openai 这个 Python 包直接调
dashscope_base_url = https://maas.qianwenaiapi.com/compatible-mode/v1


# ============================================================================
# 【检索参数配置 — RAG 核心调参区】
# 这些参数直接影响 RAG 系统的检索质量和回答准确度，是面试高频考点
# ============================================================================
[retrieval]
# 父块大小（字符数）：大块保留更多上下文，用于最终喂给 LLM
# 1500 个字符 ≈ 500-750 个中文字，适合容纳年报中一个完整的财务附注段落
# 年报段落通常 300-800 字，1500 确保完整覆盖 + 有冗余上下文
parent_chunk_size = 1500

# 子块大小（字符数）：小块用于精确检索匹配
# 400 个字符 ≈ 130-200 个中文字，金融文本密度高，需要更大粒度
# 太小的子块（如 300）可能只切到半个财务指标说明，降低检索精度
child_chunk_size = 400

# 块重叠大小（字符数）：相邻 chunk 之间的重叠字符数
# 年报中常见"详见附注X""如前述"等交叉引用，重叠大一点防止关键信息被切断
# 一般设为 chunk_size 的 15%-20%
chunk_overlap = 80

# 检索返回的 Top-K 数量：从向量库中召回最相似的 K 个文档片段
# 太小：可能遗漏关键信息；太大：引入噪声，且浪费 LLM token
# 推荐 3-5，本系统用父子索引策略，后续还会用 Rerank 二次筛选
retrieval_k = 3

# 候选数量 M：检索时先粗筛 M 个候选，再从中精排选出 K 个
# 这是 IVF（倒排索引）类算法的参数，M 越大召回率越高但速度越慢
# 一般 M = 2~4 倍的 K
candidate_m = 2


# ============================================================================
# 【日志配置】
# 作用：记录系统运行日志，方便排查问题和监控系统状态
# ============================================================================
[logger]
# 日志文件路径（为空则只输出到控制台）
# 示例：logs/rag_2024.logs
log_file = logs/rag_2026.log


# ============================================================================
# 【应用配置】
# 作用：业务层面的配置，如数据分类、客服电话等
#
# 【数据分类说明】
#   data/finance/ 目录按数据类型分子目录，对应 valid_sources 中的分类：
#   ├── annual_reports/      → 上市公司年报（兴业银行、联化科技等）
#   ├── products/            → 银行产品手册（理财、贷款、信用卡、存款等）
#   ├── industry_knowledge/  → 行业知识（监管法规、财务指标、金融术语、面试题）
#   └── faq/                 → 高频问答缓存（CSV 导入 MySQL，分类字段对应上述三个数据源）
# ============================================================================
[app]
# 有效的知识来源分类，与 data/finance/ 下三个数据源子目录一一对应
# faq 是 MySQL 缓存层，不属于向量检索数据源，故不在此列
valid_sources = ["annual_reports", "products", "industry_knowledge"]

# 兴业银行全国统一客服电话
customer_service_phone = 95561